name: Streamlit CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run a test (or a linter)
        run: |
          echo "Simulating tests for your Streamlit app..."
          # Di sini Anda bisa menambahkan perintah untuk linter (misalnya 'flake8' atau 'black') atau tes unit jika ada.
          echo "Tests passed successfully!"