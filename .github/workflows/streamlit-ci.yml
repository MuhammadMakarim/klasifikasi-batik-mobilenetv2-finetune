name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Tahap 1: Continuous Integration (CI)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run a test
        run: echo "Tests passed successfully!"

  # ---
  # Tahap 2: Continuous Deployment (CD)
  # Langkah ini akan berjalan hanya jika tahap 'build-and-test' berhasil
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Kita atur 'false' karena ini hanya contoh, tidak diunggah ke registry.
          tags: my-streamlit-app:latest
          
      - name: Run the Docker container
        run: |
          docker run -d -p 8501:8501 my-streamlit-app:latest
          echo "Streamlit app is running in a Docker container!"